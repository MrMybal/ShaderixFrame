name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/documentation.yml'
      - 'README.md'
      - 'NOTICE.md'
      - 'LICENSE'
      - 'docs/**'
      - 'sdk/**'
      - 'shaders/**'
      - 'src/mcp/Protocol.cpp'
      - 'cydoc.*.json'
      - 'tools/build_cydoc.py'
      - 'tools/cydoc/**'
      - 'vendor/cydoc/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/cydoc/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Restore pinned documentation tools
        run: npm ci --prefix tools/cydoc --omit=peer --ignore-scripts --no-audit --no-fund
      - name: Generate and verify the complete CyDoc reader
        run: python tools/build_cydoc.py --check --test
      - name: Upload only the documentation export
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/help
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the documentation reader
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
